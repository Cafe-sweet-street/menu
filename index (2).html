 m.innerHTML=D.map(s=>`<section id="${s.id}"><h2>${s.ic} ${tx(s.t)}</h2><div class="cols">`+s.g.map(g=>`<div class="cd"><h3><span>${tx(g.n)}</span>${g.p?`<em>${tx(g.p)}</em>`:''}</h3>${g.note?`<p class="nt">${tx(g.note)}</p>`:''}`+g.i.map(i=>`<div class="it"><div><div class="nm">${tx(i[0])}</div>${i[2]?`<div class="ds">${tx(i[2])}</div>`:''}</div>${i[1]?`<div class="pw">${pr(i[1])}</div>`:''}</div>`).join('')+`</div>`).join('')+`</div></section>`).join('');
}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-l]');if(b){L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(x){}draw()}});
draw();
</script>
